name: Deploy checkout functions

# Deploys the Edge Functions and database migrations in supabase/ to the
# project that hosts checkout (reference zqomzteaeiqtnipkgyuo) when they
# change on main. Until every secret they need is set, it deploys nothing and
# finishes green with a notice naming what is missing (scripts/ci/deploy-supabase.sh).
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'js/house-core.js'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: zqomzteaeiqtnipkgyuo
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy migrations and functions, or skip if secrets are missing
        run: scripts/ci/deploy-supabase.sh
