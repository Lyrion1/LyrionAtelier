name: Deploy checkout functions

# Deploys the Edge Functions and database migrations in supabase/ to the
# project that hosts checkout (reference zqomzteaeiqtnipkgyuo) when they
# change on main.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'js/house-core.js'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: zqomzteaeiqtnipkgyuo
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set, so the functions cannot be deployed."
            exit 1
          fi
      - name: Apply database migrations
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::SUPABASE_DB_PASSWORD is not set; migrations were not applied."
            exit 0
          fi
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy functions
        run: |
          cmp js/house-core.js supabase/functions/_shared/house-core.js
          for fn in create-checkout stripe-webhook delivery-approve birthday-book enquiry house-cron; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt
          done
