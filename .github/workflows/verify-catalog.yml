name: Verify catalogue

# One slug per product across the catalogue, the shop, the product pages, the
# reading and certificate buttons, the checkout and Printful. Fails on a
# malformed data/catalogue.json; never fails because of the house engine's
# files (data/house.json, data/designs-queue.json, data/codex-queue/).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: House rules, catalogue and design intake tests
        run: node --test tests/house.test.mjs tests/design-intake.test.mjs
      - name: Every listed product is buyable under one slug
        run: node scripts/verify-catalog.mjs

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check the Edge Functions
        working-directory: supabase/functions
        run: deno check */index.ts
      - name: Fulfilment tests (stand-in Printful API)
        working-directory: supabase/functions
        run: deno test --allow-net --allow-env --allow-read tests/
