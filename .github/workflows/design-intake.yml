name: Design intake

# Approved designs (data/designs-queue.json, from the house engine) become
# Printful products once their artwork lands in artwork/incoming/. See
# scripts/design-intake.mjs and docs/SHOPKEEPER.md.
on:
  push:
    branches: [main]
    paths:
      - 'data/designs-queue.json'
      - 'data/garments.json'
      - 'artwork/incoming/**'
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: house-commits
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build designs that have artwork
        env:
          PRINTFUL_API_KEY: ${{ secrets.PRINTFUL_API_KEY }}
          PRINTFUL_STORE_ID: ${{ secrets.PRINTFUL_STORE_ID }}
        run: |
          if [ -z "$PRINTFUL_API_KEY" ]; then
            echo "::warning::PRINTFUL_API_KEY is not set; designs cannot be built."
            exit 0
          fi
          node scripts/design-intake.mjs
      - name: Regenerate the checkout price map and check everything
        run: |
          node scripts/build-checkout-catalog.mjs
          node scripts/verify-catalog.mjs
      - name: Commit the products
        id: commit
        run: |
          git config user.name "lyrion-house[bot]"
          git config user.email "lyrion-house@users.noreply.github.com"
          git add data/catalogue.json data/designs-built.json public/data/products.json images/products
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "designs: build approved designs"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "::notice::Pages rebuilds on its own after the push."
