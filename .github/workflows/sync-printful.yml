name: Sync Printful snapshot

# Records which sync products and variants exist in the Printful store
# (data/printful-sync.json). CI checks data/catalogue.json against it.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch the Printful store (skips until PRINTFUL_API_KEY is set)
        env:
          PRINTFUL_API_KEY: ${{ secrets.PRINTFUL_API_KEY }}
          PRINTFUL_STORE_ID: ${{ secrets.PRINTFUL_STORE_ID }}
        run: node scripts/sync-printful.js
      - name: Check the catalogue against it
        run: node scripts/verify-catalog.mjs
      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/printful-sync.json 2>/dev/null || true
          git diff --cached --quiet && echo "No changes" || (git commit -m "chore(printful): refresh store snapshot" && git push)
